<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>E-Eligible Web App</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  <style>
    body { background-color: #f4f7f6; font-family: 'Inter', sans-serif; overflow-x: hidden; }
    .sidebar { 
      min-width: 260px; 
      max-width: 260px; 
      height: 100vh; 
      background: #1a252f; 
      color: #ecf0f1; 
      position: fixed; 
      transition: 0.3s; 
      z-index: 1000; 
      display: flex;
      flex-direction: column;
      overflow-y: auto; /* Mengizinkan scroll vertikal */
      scrollbar-width: thin; /* Untuk browser Firefox */
      scrollbar-color: #34495e #1a252f;
    }

    /* Kustomisasi scrollbar untuk Chrome/Edge/Safari */
    .sidebar::-webkit-scrollbar {
      width: 6px;
    }
    .sidebar::-webkit-scrollbar-track {
      background: #1a252f;
    }
    .sidebar::-webkit-scrollbar-thumb {
      background: #34495e;
      border-radius: 10px;
    }
    .sidebar .nav-link { color: #bdc3c7; padding: 12px 20px; border-radius: 0; border-left: 4px solid transparent; transition: 0.2s; }
    .sidebar .nav-link:hover, .sidebar .nav-link.active { background: #2c3e50; color: #fff; border-left: 4px solid #3498db;}
    .main-content { margin-left: 260px; padding: 30px; transition: 0.3s; width: calc(100% - 260px); }
    .card { border: none; box-shadow: 0 0.125rem 0.25rem rgba(0, 0, 0, 0.075); border-radius: 12px; }
    .table-responsive { max-height: 70vh; overflow: auto; border-radius: 8px; border: 1px solid #dee2e6; }
    .table thead th { position: sticky; top: 0; background: #f8f9fa; color: #333; font-weight: 600; text-transform: uppercase; font-size: 0.75rem; border-bottom: 2px solid #dee2e6; z-index: 5; white-space: nowrap; }
    .loading-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.85); display: none; justify-content: center; align-items: center; z-index: 9999; flex-direction: column; }
    #login-page { background: linear-gradient(135deg, #2c3e50, #4ca1af); height: 100vh; display: flex; align-items: center; justify-content: center; }
    .logo-img {
      width: 80px;
      height: 80px;
      object-fit: contain;
      margin-bottom: 1rem;}

    #print-area { display: none; }

    @media print {
      @page { size: portrait; margin: 1.5cm; }
      
      /* Sembunyikan elemen UI aplikasi */
      #app-content, .no-print, .sidebar, .main-content, .loading-overlay { 
        display: none !important; 
      }
      
      /* Tampilkan print-area */
      #print-area { 
        display: block !important; 
        width: 100%; 
        background: white;
        color: black;
        visibility: visible !important;
      }

      #print-area * { visibility: visible !important; }

      .page-break { page-break-after: always; }
      
      /* Struktur Kop Surat yang Lebih Stabil */
      .kop-table {
        width: 100%;
        border-collapse: collapse;
        border-bottom: 3px double #000;
        margin-bottom: 20px;
      }
      .kop-table td { border: none !important; padding: 5px; }
      .kop-logo { width: 90px; text-align: center; }
      .kop-text { text-align: center; }
      .kop-text h4 { margin: 0; font-size: 14pt; font-weight: bold; line-height: 1.2; }
      .kop-text h3 { margin: 0; font-size: 18pt; font-weight: bold; line-height: 1.2; }
      .kop-text p { margin: 0; font-size: 10pt; }

      /* Tabel Data Laporan */
      .data-table { 
        width: 100%; 
        border-collapse: collapse; 
        margin-top: 15px; 
      }
      .data-table th { 
        background-color: #f2f2f2 !important; 
        border: 1px solid #000 !important; 
        padding: 8px 4px; 
        font-size: 9pt; 
        text-align: center;
        font-weight: bold;
      }
      .data-table td { 
        border: 1px solid #000 !important; 
        padding: 6px 4px; 
        font-size: 8.5pt; 
      }
      
      /* Area Tanda Tangan */
      .ttd-wrapper { 
        margin-top: 30px; 
        width: 100%;
        display: block;
      }
      .ttd-box { 
        float: right; 
        width: 250px; 
        text-align: center; 
      }
      .ttd-space { height: 75px; }
    }
    
    .sidebar-logo-container {
      width: 50px;
      height: 50px;
      background: white;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 5px;
      margin-right: 12px;
    }
  </style>
</head>
<body>

  <div id="loading" class="loading-overlay">
    <div class="spinner-grow text-primary mb-3"></div>
    <span class="fw-bold">Sedang Memproses...</span>
  </div>

  <div id="print-area"></div>

  <!-- Input File Tersembunyi untuk Import -->
  <input type="file" id="import-input" style="display: none;" accept=".xlsx, .xls, .csv">

  <!-- Login Section -->
  <div id="login-page">
    <div class="card p-4 shadow-lg" style="width: 380px;">
      <div class="text-center mb-4">

       alt="Logo Elite" 
       class="logo-img"
       style="width: 80px; height: 80px; object-fit: contain; border-radius: 12px;"
       onerror="this.onerror=null; this.src='https://dummyimage.com/160x160/0d6efd/ffffff&text=Elite';">
        <h3 class="fw-bold">Si-MEli</h3>

      <div class="mb-3">

  <!-- Main App Section -->
  <div id="app-content" style="display: none;">
    <div class="d-flex">
      <!-- Sidebar -->
      <nav class="sidebar">
        <div class="d-flex align-items-center mb-4 border-bottom pb-3">
          <div class="sidebar-logo-container shadow-sm">
            <img src="https://lh3.googleusercontent.com/u/0/d/1MaFJWgjCTo3BXamPI6Ipte3U2-8a-t0K=w500-h500" 
                 alt="Logo SMAN 9 Surabaya"

                 onerror="this.onerror=null; this.src='https://via.placeholder.com/50?text=9';">
          </div>
          <h4 class="fw-bold mb-0">Si-MEli</h4>

          </button>

      </nav>

      <!-- Content Area -->

        <header class="d-flex justify-content-between align-items-center mb-4 pb-3 border-bottom">

  <!-- Status Modal -->

      <div class="modal-content text-center p-4">
        <div id="status-icon" class="mb-3"></div>
        <h4 id="status-title" class="fw-bold"></h4>
        <p id="status-message" class="text-muted"></p>
        <button class="btn btn-dark w-100" data-bs-dismiss="modal">Tutup</button>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
  <script>
    // Bridge frontend Vercel -> /api/gas -> Google Apps Script backend.
    // Backend URL dikonfigurasi aman melalui Environment Variables Vercel,
    // sehingga tidak perlu memanggil script.google.com langsung dari browser.
    (function installAppsScriptBridge() {
      window.google = window.google || {};
      window.google.script = window.google.script || {};

      const allowedMethods = new Set([
        'loginUser', 'getDashboardData', 'getData', 'saveBulkData', 'generateRanking'
      ]);

      class AppsScriptRunBridge {
        constructor() { this.successHandler = null; this.failureHandler = null; }
        withSuccessHandler(fn) { this.successHandler = fn; return this; }
        withFailureHandler(fn) { this.failureHandler = fn; return this; }

        _invoke(method, args) {
          if (!allowedMethods.has(method)) {
            const error = new Error('Metode backend tidak diizinkan: ' + method);
            if (this.failureHandler) this.failureHandler(error);
            return;
          }
          fetch('/api/gas', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ method, args })
          })
          .then(async response => {
            const payload = await response.json().catch(() => ({}));
            if (!response.ok) throw new Error(payload.message || 'HTTP ' + response.status);
            return payload;
          })
          .then(result => { if (this.successHandler) this.successHandler(result); })
          .catch(error => { if (this.failureHandler) this.failureHandler(error); });
        }
      }

      ['loginUser', 'getDashboardData', 'getData', 'saveBulkData', 'generateRanking'].forEach(method => {
        AppsScriptRunBridge.prototype[method] = function(...args) {
          this._invoke(method, args);
        };
      });

      Object.defineProperty(window.google.script, 'run', {
        configurable: true,
        get: () => new AppsScriptRunBridge()
      });
    })();

    let user = null;
    const modal = new bootstrap.Modal(document.getElementById('statusModal'));

    function showLoading(show) { document.getElementById('loading').style.display = show ? 'flex' : 'none'; }

    function notify(success, title, msg) {
      document.getElementById('status-icon').innerHTML = success ? 
        `<i class="bi bi-check-circle-fill text-success" style="font-size: 4rem;"></i>` : 
        `<i class="bi bi-x-circle-fill text-danger" style="font-size: 4rem;"></i>`;
      document.getElementById('status-title').innerText = title;
      document.getElementById('status-message').innerText = msg;
      modal.show();
    }

    function handleLogin() {
      const u = document.getElementById('username').value;
      const p = document.getElementById('password').value;
      if (!u || !p) return notify(false, "Login Gagal", "Isi username dan password terlebih dahulu.");
      
      showLoading(true);
      google.script.run.withSuccessHandler(res => {
        showLoading(false);
        if (res.success) {
          user = res;
          document.getElementById('login-page').style.display = 'none';
          document.getElementById('app-content').style.display = 'block';
          document.getElementById('display-user').innerText = res.username;
          document.getElementById('badge-role').innerText = res.role.toUpperCase();
          buildMenu();
          navigate('dashboard');
        } else {
          notify(false, "Login Gagal", res.message || "Username atau password salah.");
        }
      })
      .withFailureHandler(err => {
        showLoading(false);
        notify(false, "Sistem Bermasalah", "Terjadi kesalahan koneksi saat login.");
      })
      .loginUser(u, p);
    }

    function handleLogout() {
      user = null;
      document.getElementById('login-page').style.display = 'flex';
      document.getElementById('app-content').style.display = 'none';
    }

    function buildMenu() {
      const menu = {
        admin: [
          {id:'dashboard', icon:'grid-1x2', label:'Dashboard'},
          {id:'users', icon:'people', label:'Kelola User'},
          {id:'mapel', icon:'journal-bookmark', label:'Seting Mapel'},
          {id:'siswa', icon:'person-vcard', label:'Seting Siswa'},
          {id:'kelompok', icon:'diagram-3', label:'Seting Kelompok'},
          {id:'bobot', icon:'sliders', label:'Seting Bobot'},
          {id:'setingurutan', icon:'sort-down', label:'Seting Urutan'},
          {id:'rekapnilai', icon:'table', label:'Rekap Nilai'},
          {id:'peringkatlokal', icon:'award', label:'Peringkat'}
        ],
        operator: [
          {id:'dashboard', icon:'grid-1x2', label:'Dashboard'},
          {id:'nilai1', icon:'1-square', label:'Semester 1'},
          {id:'nilai2', icon:'2-square', label:'Semester 2'},
          {id:'nilai3', icon:'3-square', label:'Semester 3'},
          {id:'nilai4', icon:'4-square', label:'Semester 4'},
          {id:'nilai5', icon:'5-square', label:'Semester 5'},
          {id:'tka', icon:'file-earmark-text', label:'Nilai TKA'},
          {id:'prestasi', icon:'trophy', label:'Seting Prestasi'},
          {id:'rekapnilai', icon:'table', label:'Rekap Nilai'},
          {id:'peringkatlokal', icon:'award', label:'Peringkat'}
        ]
      };
      const items = menu[user.role];
      document.getElementById('nav-container').innerHTML = items.map(item => `
        <a href="#" id="nav-${item.id}" class="nav-link" onclick="navigate('${item.id}')">
          <i class="bi bi-${item.icon} me-3"></i> ${item.label}
        </a>
      `).join('');
    }

    function navigate(view) {
      document.querySelectorAll('.nav-link').forEach(el => el.classList.remove('active'));
      const activeNav = document.getElementById('nav-' + view);
      if(activeNav) activeNav.classList.add('active');
      document.getElementById('page-title').innerText = view.toUpperCase();
      
      if (view === 'dashboard') renderDashboard();
      else if (['rekapnilai', 'peringkatlokal'].includes(view)) renderReportTable(view);
      else renderCRUDTable(view);
    }

    function renderDashboard() {
      showLoading(true);
      google.script.run
        .withSuccessHandler(data => {
          showLoading(false);
          let cards = "";
          for (let k in data.perKelompok) {
            cards += `
              <div class="col-md-4 mb-4">
                <div class="card h-100 p-3">
                  <div class="d-flex align-items-center mb-2">
                    <div class="bg-primary-subtle text-primary p-2 rounded me-3"><i class="bi bi-people-fill"></i></div>
                    <h6 class="mb-0 fw-bold">${k}</h6>
                  </div>
                  <div class="row text-center mt-2">
                    <div class="col-6 border-end">
                      <small class="text-muted d-block">Siswa</small>
                      <span class="fw-bold h4">${data.perKelompok[k].count}</span>
                    </div>
                    <div class="col-6">
                      <small class="text-muted d-block">Kuota</small>
                      <span class="fw-bold h4 text-success">${data.perKelompok[k].kuota}</span>
                    </div>
                  </div>
                </div>
              </div>`;
          }
          document.getElementById('view-container').innerHTML = `
            <div class="row">
              <div class="col-12 mb-4">
                <div class="card bg-primary text-white p-4 d-flex flex-row align-items-center justify-content-between">
                  <div><h5>Total Seluruh Siswa</h5><h2 class="fw-bold mb-0">${data.totalSiswa}</h2></div>
                  <i class="bi bi-mortarboard" style="font-size: 3.5rem; opacity: 0.3;"></i>
                </div>
              </div>
              ${cards}
            </div>
          `;
        })
        .withFailureHandler(err => {
          showLoading(false);
          notify(false, "Gagal Memuat Dashboard", "Terjadi kesalahan saat mengambil data statistik.");
        })
        .getDashboardData();
    }

    function renderReportTable(view) {
      showLoading(true);
      const targetSheet = (view === 'rekapnilai') ? 'rekapnilai' : view;
      
      google.script.run.withSuccessHandler(res => {
        showLoading(false);
        const rules = res.kelompokRules || {};
        const isRekap = (view === 'rekapnilai');

        let headersHtml = res.headers.map(h => `<th class="text-center">${h}</th>`).join('');
        
        const rowsHtml = res.rows.map(r => {
            const kelompokSiswa = r[3]; 
            const allowedMapels = rules[kelompokSiswa] || [];
            
            return `<tr>${r.map((c, idx) => {
                const headerName = res.headers[idx];
                let textAlign = (headerName === 'Nama Siswa' || headerName === 'Hasil') ? "text-align: left;" : "text-align: center;";
                let cellStyle = textAlign;
                let displayValue = (c === null || c === undefined) ? "" : c;
                
                if (isRekap && headerName.startsWith('S') && !['SR', 'SP', 'STKA', 'SG', 'SK'].includes(headerName)) {
                    const baseMapel = headerName.substring(1);
                    if (!allowedMapels.includes(baseMapel)) {
                        displayValue = "-";
                        cellStyle += "background-color: #f8f9fa; color: #ccc;";
                    }
                }

                if (headerName === 'SG' && displayValue !== "" && !isNaN(displayValue)) {
                    displayValue = parseFloat(displayValue).toFixed(2);
                    cellStyle += "font-weight: bold; color: #2c3e50;";
                }
                
                if (['SR', 'SP', 'STKA', 'SK'].includes(headerName)) {
                    cellStyle += "font-weight: 500;";
                }
                
                return `<td style="${cellStyle}">${displayValue}</td>`;
            }).join('')}</tr>`;
        }).join('');

        document.getElementById('view-container').innerHTML = `
          <div class="card p-3">
            <div class="d-flex justify-content-between mb-3 no-print">
              <h5 class="fw-bold">${view.toUpperCase()}</h5>
              <div class="d-flex gap-2">
                  <button class="btn btn-outline-dark btn-sm" onclick="exportToExcel('${view}')"><i class="bi bi-file-earmark-spreadsheet"></i> EXPORT EXCEL</button>
                  ${view === 'peringkatlokal' ? `
                    <button class="btn btn-primary btn-sm fw-bold" onclick='prepareAndPrint(${JSON.stringify(res).replace(/'/g, "&apos;")})'>
                      <i class="bi bi-printer"></i> CETAK HASIL
                    </button>
                    <button class="btn btn-warning btn-sm fw-bold" onclick="runRanking()">GENERATE RANKING</button>
                  ` : ''}
              </div>
            </div>
            <div class="table-responsive">
                <table id="report-table" class="table table-bordered table-sm table-hover" style="font-size: 0.82rem;">
                    <thead class="table-light"><tr>${headersHtml}</tr></thead>
                    <tbody>${rowsHtml}</tbody>
                </table>
            </div>
          </div>`;
      }).getData(targetSheet);
    }
    function prepareAndPrint(res) {
      const headers = res.headers;
      const rows = res.rows;
      const idxKelompok = headers.indexOf('Kelompok');
      const idxPeringkat = headers.indexOf('Peringkat');
      
      const groupedData = {};
      rows.forEach(row => {
        const key = row[idxKelompok] || "Lainnya";
        if (!groupedData[key]) groupedData[key] = [];
        groupedData[key].push(row);
      });

      for (let key in groupedData) {
        groupedData[key].sort((a, b) => (parseInt(a[idxPeringkat]) || 999) - (parseInt(b[idxPeringkat]) || 999));
      }

      let printHtml = "";
      const visibleIndices = headers.map((h, i) => (h !== 'Kesediaan' && h !== 'Peringkat') ? i : -1).filter(i => i !== -1);
      
      const kelompokKeys = Object.keys(groupedData);
      kelompokKeys.forEach((kelompok, index) => {
        printHtml += `
          <div class="print-page-wrapper">
            <!-- Kop Surat menggunakan Tabel agar stabil -->
            <table class="kop-table">
              <tr>
                <td class="kop-logo">
                   <img src="https://lh3.googleusercontent.com/u/0/d/1EECQjQ8tmGLlWMzv0jFmKoEVb1nF5Dkt=w500-h500" 
                     alt="Logo" style="width: 85px; height: 85px; object-fit: contain;">
                </td>
                <td class="kop-text">
                  <h4>PEMERINTAH PROVINSI JAWA TIMUR</h4>
                  <h4>DINAS PENDIDIKAN</h4>
                  <h3>SMA NEGERI 9 SURABAYA</h3>
                  <p>Jalan Wijayakusuma Nomor 48, Ketabang, Genteng, Surabaya, Jawa Timur 60272</p>
                  <p>Telepon (031) 5342608-Faksimili (031)5477817</p>
                  <p>Laman https://sman9sby.sch.id Pos-El smanixsurabaya@gmail.com</p>
                </td>
                <td style="width: 90px;"></td> <!-- Spacer seimbang -->
              </tr>
            </table>
            
            <h4 style="text-align: center; margin-top: 15px; font-weight: bold; text-decoration: underline; margin-bottom: 5px;">LAPORAN HASIL SELEKSI E-ELIGIBLE</h4>
            <h5 style="text-align: center; font-weight: bold; margin-bottom: 20px;">KELOMPOK: ${kelompok.toUpperCase()}</h5>
            
            <p style="font-size: 10pt; margin-bottom: 10px;">Daftar siswa yang dinyatakan Eligible berdasarkan pemeringkatan:</p>

            <table class="data-table">
              <thead>
                <tr>${visibleIndices.map(i => `<th>${headers[i]}</th>`).join('')}</tr>
              </thead>
              <tbody>
                ${groupedData[kelompok].map(row => `
                  <tr>
                    ${visibleIndices.map(i => {
                      let align = (headers[i] === 'Nama Siswa' || headers[i] === 'Hasil') ? 'left' : 'center';
                      let val = row[i];
                      if (headers[i] === 'SG' && !isNaN(val) && val !== "") val = parseFloat(val).toFixed(2);
                      return `<td style="text-align:${align}">${val || ''}</td>`;
                    }).join('')}
                  </tr>
                `).join('')}
              </tbody>
            </table>

            <!-- Tanda Tangan -->
            <div class="ttd-wrapper">
              <div class="ttd-box">
                <p>Surabaya, ${new Date().toLocaleDateString('id-ID', {day: 'numeric', month: 'long', year: 'numeric'})}</p>
                <p>Kepala SMA Negeri 9 Surabaya,</p>
                <div class="ttd-space"></div>
                <p><strong>TRI KURNIAWATI, M.Pd.</strong></p>
                <p>NIP. 197203251997032003</p>
              </div>
              <div style="clear: both;"></div>
            </div>
            
            ${index < kelompokKeys.length - 1 ? '<div class="page-break"></div>' : ''}
          </div>
        `;
      });

      const printContainer = document.getElementById('print-area');
      printContainer.innerHTML = printHtml;
      
      showLoading(true);
      setTimeout(() => {
        showLoading(false);
        window.print();
        setTimeout(() => { printContainer.innerHTML = ""; }, 2000);
      }, 800);
    }
    

    function exportToExcel(name) {
        const table = document.getElementById('report-table');
        const wb = XLSX.utils.table_to_book(table);
        XLSX.writeFile(wb, `${name}_Export.xlsx`);
    }

    function runRanking() {
      showLoading(true);
      google.script.run.withSuccessHandler(res => {
        showLoading(false);
        if (res.success) {
          notify(true, "Berhasil", "Data rekap dan peringkat telah diperbarui secara otomatis.");
          navigate('peringkatlokal');
        } else {
          notify(false, "Proses Gagal", res.message || "Gagal melakukan pemeringkatan.");
        }
      })
      .withFailureHandler(err => {
        showLoading(false);
        notify(false, "Kesalahan Sistem", "Server tidak menanggapi permintaan pemeringkatan.");
      })
      .generateRanking();
    }

    function addRow() {
      const table = document.getElementById('crud-table');
      if (!table) return;
      const tbody = table.querySelector('tbody');
      const columnCount = table.querySelector('thead tr').cells.length;
      const newRow = document.createElement('tr');
      
      for (let i = 0; i < columnCount; i++) {
        const cell = document.createElement('td');
        cell.contentEditable = "true";
        cell.innerText = "";
        newRow.appendChild(cell);
      }
      
      // Hapus baris pesan kosong jika ada
      const emptyRow = tbody.querySelector('.text-muted.italic');
      if (emptyRow) tbody.innerHTML = "";
      
      tbody.appendChild(newRow);
      newRow.cells[0].focus();
    }

    function handleSaveData(view) {
      const table = document.getElementById('crud-table');
      if(!table) return;
      
      const rows = Array.from(table.querySelectorAll('tbody tr'));
      // Filter baris kosong (jika ada)
      const data = rows
        .map(row => Array.from(row.cells).map(cell => cell.innerText.trim()))
        .filter(rowData => rowData.some(val => val !== ""));
      
      if (data.length === 0) return notify(false, "Peringatan", "Tidak ada data untuk disimpan.");

      showLoading(true);
      google.script.run
        .withSuccessHandler(res => {
          if (res.success) {
            showLoading(false);
            notify(true, "Berhasil Disimpan", "Semua perubahan pada tabel " + view + " telah disimpan ke database cloud.");
            navigate(view);
          } else {
            showLoading(false);
            notify(false, "Simpan Gagal", res.message || "Terjadi masalah saat menyimpan data.");
          }
        })
        .withFailureHandler(err => {
          showLoading(false);
          notify(false, "Koneksi Gagal", "Tidak dapat terhubung ke server untuk menyimpan data.");
        })
        .saveBulkData(view, data);
    }

    function renderCRUDTable(view) {
      showLoading(true);
      google.script.run.withSuccessHandler(res => {
        showLoading(false);
        const headers = res.headers;
        const rows = res.rows;
        const rules = res.kelompokRules || {};
        const isNilai = view.startsWith('nilai');
        const isTka = (view === 'tka');
        const isPrestasi = (view === 'prestasi');

        let headersHtml = headers.map(h => `<th class="text-center">${h}</th>`).join('');
        
        let rowsHtml = rows.map((row, rowIndex) => {
          const nis = row[0];
          const kelompokSiswa = row[3]; // Kolom Kelompok adalah indeks 3
          const allowedMapels = rules[kelompokSiswa] || [];

          let cellsHtml = row.map((cell, colIndex) => {
            const headerName = headers[colIndex];
            let isEditable = true;
            let cellClass = "cell-editable";

            // Aturan 1: NIS, Nama, Kelas, Kelompok di sheet Nilai, TKA, dan Prestasi TIDAK boleh diedit (Otomatis dari Siswa)
            if ((isNilai || isTka || isPrestasi) && colIndex < 4) {
              isEditable = false;
              cellClass = "cell-disabled";
            }

            // Aturan 2: Mapel di sheet Nilai harus sesuai dengan kelompoknya
            if (isNilai && colIndex >= 4) {
              if (!allowedMapels.includes(headerName)) {
                isEditable = false;
                cellClass = "cell-disabled";
                cell = "-"; // Visual tanda tidak perlu diisi
              }
            }

            return `
              <td 
                contenteditable="${isEditable}" 
                class="${cellClass}"
                data-header="${headerName}"
              >${cell !== undefined && cell !== null ? cell : ''}</td>`;
          }).join('');

          return `<tr>${cellsHtml}</tr>`;
        }).join('');

        if (rows.length === 0) {
          rowsHtml = `<tr><td colspan="${headers.length}" class="text-center p-4 text-muted italic">Tidak ada data. Tambahkan data di menu Siswa terlebih dahulu.</td></tr>`;
        }

        document.getElementById('view-container').innerHTML = `
          <div class="card p-3">
            <div class="d-flex justify-content-between align-items-center mb-3">
              <h5 class="fw-bold mb-0">Input Data ${view.toUpperCase()}</h5>
              <div class="d-flex gap-2">
                ${(!isNilai && !isTka && !isPrestasi) ? `<button class="btn btn-primary btn-sm" onclick="addRow()"><i class="bi bi-plus-lg"></i> TAMBAH</button>` : `<span class="badge bg-secondary">Data Siswa Otomatis</span>`}
                <button class="btn btn-outline-dark btn-sm" onclick="downloadTemplate('${view}')">
                  <i class="bi bi-download"></i> UNDUH TEMPLATE
                </button>
                <button class="btn btn-outline-success btn-sm" onclick="triggerImport()"><i class="bi bi-file-earmark-excel"></i> IMPORT</button>
              </div>
            </div>
            <div class="table-responsive">
              <table id="crud-table" class="table table-sm table-bordered align-middle" style="font-size: 0.85rem;">
                <thead><tr>${headersHtml}</tr></thead>
                <tbody>${rowsHtml}</tbody>
              </table>
            </div>
            <div class="mt-3 d-flex justify-content-between align-items-center">
              <small class="text-muted"><sup>*</sup> Kolom berwarna abu-abu tidak dapat diisi / otomatis dari sistem.</small>
              <button class="btn btn-success fw-bold px-4" onclick="handleSaveData('${view}')">
                <i class="bi bi-cloud-arrow-up me-2"></i> SIMPAN PERUBAHAN
              </button>
            </div>
          </div>
        `;
      }).getData(view);
    }
    function downloadTemplate(view) {
      const table = document.getElementById('crud-table');
      if (!table) return;

      const headers = Array.from(table.querySelectorAll('thead th')).map(th => th.innerText);
      const rows = Array.from(table.querySelectorAll('tbody tr')).map(tr => {
        return Array.from(tr.cells).map(td => td.innerText.trim());
      });

      // Gabungkan header dan baris data
      const finalData = [headers, ...rows];
      
      const ws = XLSX.utils.aoa_to_sheet(finalData);
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, "Template");
      XLSX.writeFile(wb, `Template_${view}.xlsx`);
    }
    function triggerImport() {
      document.getElementById('import-input').click();
    }

    document.getElementById('import-input').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(evt) {
        try {
          const data = evt.target.result;
          const workbook = XLSX.read(data, { type: 'binary' });
          const sheetName = workbook.SheetNames[0];
          const sheet = workbook.Sheets[sheetName];
          // Mengubah sheet ke array of arrays (matrix)
          const jsonData = XLSX.utils.sheet_to_json(sheet, { header: 1 });
          
          if (jsonData.length <= 1) {
            notify(false, "Import Gagal", "File Excel kosong atau tidak memiliki data.");
            return;
          }

          // Baris pertama dianggap header, baris berikutnya adalah data
          const importedHeaders = jsonData[0];
          const importedRows = jsonData.slice(1);

          // Tampilkan konfirmasi atau langsung proses ke tabel
          processImportedData(importedRows);
          
          // Reset input file agar bisa digunakan lagi
          e.target.value = "";
        } catch (err) {
          notify(false, "Kesalahan", "Gagal membaca file: " + err.message);
        }
      };
      reader.readAsBinaryString(file);
    });

    function processImportedData(newRows) {
      const table = document.getElementById('crud-table');
      const tbody = table.querySelector('tbody');
      const headerCount = table.querySelectorAll('thead th').length;

      // Hapus baris kosong/keterangan jika ada
      const emptyRow = tbody.querySelector('.empty-row');
      if (emptyRow) emptyRow.remove();

      let replacedCount = 0;
      let addedCount = 0;

      newRows.forEach(rowData => {
        if (!rowData[0]) return; // Lewati jika NIS kosong

        const newNis = rowData[0].toString().trim();
        let existingRow = null;

        // Cari NIS yang sama di baris yang sudah ada di tabel
        const rows = Array.from(tbody.querySelectorAll('tr'));
        for (let tr of rows) {
          const currentNis = tr.cells[0].innerText.trim();
          if (currentNis === newNis) {
            existingRow = tr;
            break;
          }
        }

        if (existingRow) {
          // LOGIKA REPLACE: Update isi sel pada baris yang ditemukan
          for (let i = 0; i < headerCount; i++) {
            // Jangan ganti jika kolom diproteksi (class cell-disabled)
            if (!existingRow.cells[i].classList.contains('cell-disabled')) {
                existingRow.cells[i].innerText = rowData[i] !== undefined ? rowData[i] : "";
            }
          }
          replacedCount++;
        } else {
          // LOGIKA ADD NEW: Tambah baris baru jika NIS tidak ditemukan
          const tr = document.createElement('tr');
          for (let i = 0; i < headerCount; i++) {
            const td = document.createElement('td');
            td.contentEditable = "true";
            td.className = "cell-editable";
            td.innerText = rowData[i] !== undefined ? rowData[i] : "";
            tr.appendChild(td);
          }
          tbody.appendChild(tr);
          addedCount++;
        }
      });
      
      notify(true, "Berhasil", `Import Selesai: ${replacedCount} data diperbarui, ${addedCount} data baru ditambahkan. Klik SIMPAN untuk memproses ke sistem.`);
    }
  </script>
